<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FreeLLM Gateway · Model Pool</title>
  <style>
    :root { color-scheme: dark; --bg:#081020; --panel:#101c33; --panel2:#0c172b; --line:#263b5e; --blue:#527fff; --text:#f3f6ff; --muted:#9aabc7; --green:#35d399; --amber:#f5b94c; --red:#f26b6b; }
    * { box-sizing:border-box; } body { margin:0; background:linear-gradient(135deg,#06101f,#0d1730); color:var(--text); font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button, input, select, textarea { font:inherit; } button { border:1px solid #3d5a87; background:#162743; color:#fff; border-radius:8px; padding:9px 13px; cursor:pointer; } button:hover { border-color:#77a4ff; } button.primary { background:var(--blue); border-color:var(--blue); } button.danger { color:#ffaaa9; border-color:#77383f; } button.small { padding:5px 8px; font-size:12px; }
    .app { min-height:100vh; display:grid; grid-template-columns:230px minmax(0,1fr); } aside { border-right:1px solid var(--line); padding:24px 16px; } .brand { font-size:20px; font-weight:750; margin:8px 10px 42px; } .brand span { color:#55a4ff; } nav { display:grid; gap:4px; } nav button { width:100%; border:0; background:transparent; color:var(--muted); text-align:left; padding:13px 14px; } nav button.active, nav button:hover { color:#fff; background:#173264; }
    main { padding:32px 36px; max-width:1540px; width:100%; } header { display:flex; justify-content:space-between; gap:20px; align-items:center; margin-bottom:24px; } .eyebrow { margin:0 0 5px; color:#6f98d7; font:11px ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.13em; } h1 { margin:0; font-size:36px; } h2 { margin:0 0 14px; font-size:20px; } h3 { margin:0 0 8px; } .header-actions { display:flex; align-items:center; gap:10px; } .service-pill { color:var(--green); border:1px solid #196c55; border-radius:999px; padding:7px 11px; font-size:12px; }
    .view { display:none; } .view.active { display:block; } .grid { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; } .stats { grid-column:1/-1; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; } .card { background:rgba(16,28,51,.9); border:1px solid var(--line); border-radius:12px; padding:18px; } .stat b { display:block; font-size:28px; margin-bottom:3px; } .muted { color:var(--muted); } .toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-bottom:12px; } .toolbar .actions { display:flex; gap:8px; align-items:center; }
    table { width:100%; border-collapse:collapse; } th, td { padding:13px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; } th { color:var(--muted); font-size:12px; white-space:nowrap; } td small { display:block; color:var(--muted); margin-top:4px; } .tag { display:inline-block; border:1px solid #3276c7; color:#7fc1ff; border-radius:4px; padding:3px 6px; margin:2px; font-size:11px; } .tag.image { border-color:#4abdc1; color:#76e5e2; } .status { border-radius:5px; padding:5px 8px; font-size:11px; white-space:nowrap; } .ok { color:var(--green); border:1px solid #196c55; } .slow { color:var(--amber); border:1px solid #826125; } .bad { color:var(--red); border:1px solid #77383f; } .row-actions { display:flex; flex-wrap:wrap; gap:5px; min-width:190px; } .empty { padding:42px 12px; text-align:center; color:var(--muted); }
    .flow { display:flex; justify-content:space-between; align-items:center; color:#76b8ff; font-size:22px; margin:22px 0 30px; } .flow span { text-align:center; font-size:11px; color:var(--muted); } .flow small { display:block; } .rule { padding:13px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; } .toggle { background:var(--blue); width:38px; height:20px; border-radius:20px; position:relative; } .toggle:after { content:""; position:absolute; right:3px; top:3px; width:14px; height:14px; background:white; border-radius:50%; }
    .endpoint-grid, .capability-grid, .provider-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .endpoint { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:14px; } .provider-model-list { display:grid; gap:6px; margin:12px 0 10px; } .provider-model-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); } .provider-model-row > div:first-child { min-width:0; } .provider-model-row .tag { margin:0 2px 0 0; } code { color:#9fc4ff; word-break:break-all; } .capability-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } .capability b { display:block; font-size:24px; } .notice { border:1px solid #7e6329; color:#ffd78b; background:#2a2110; padding:11px 13px; border-radius:8px; margin-bottom:14px; } .success { border-color:#196c55; color:#9af2cc; background:#102d2a; } .error { border-color:#77383f; color:#ffaaa9; background:#32191f; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } label { display:grid; gap:6px; color:var(--muted); font-size:12px; } input, select, textarea { width:100%; border:1px solid #3d5a87; border-radius:8px; background:#0b1529; color:#fff; padding:9px 11px; } textarea { min-height:70px; resize:vertical; } .inline-field { display:flex; align-items:center; gap:8px; } .inline-field input, .inline-field select { min-width:0; flex:1; } .inline-field .ghost { white-space:nowrap; } .checks { display:flex; flex-wrap:wrap; gap:9px; } .checks label { display:flex; align-items:center; gap:5px; color:var(--text); } .checks input { width:auto; } .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
    .modal-layer, .auth-gate { position:fixed; inset:0; display:grid; place-items:center; background:rgba(5,12,25,.8); z-index:10; padding:18px; } .modal-layer[hidden], .auth-gate[hidden] { display:none; } .modal { width:min(680px,100%); max-height:90vh; overflow:auto; } .auth-card { width:min(420px,100%); } .auth-form { display:flex; gap:8px; } .auth-form input { flex:1; } .auth-error { color:var(--red); min-height:20px; margin:10px 0 0; } a { color:#9fc4ff; }
    .provider-cell { display:flex; gap:9px; align-items:center; } .provider-cell > div { min-width:0; } .mark { flex:0 0 auto; display:inline-flex; width:27px; height:27px; border-radius:8px; background:#173264; border:1px solid var(--line); align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#7fc1ff; } a.btn { display:inline-block; border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:8px; padding:6px 11px; text-decoration:none; font-size:12px; white-space:nowrap; } a.btn:hover { border-color:#77a4ff; } a.ghost { font-size:12px; white-space:nowrap; }
    .bulk-picker { margin-top:8px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); max-height:220px; overflow:auto; } .bulk-toolbar { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel2); z-index:1; } .bulk-list { display:grid; gap:1px; padding:5px; } .bulk-item { display:flex; align-items:center; gap:8px; padding:7px 8px; color:var(--text); border-radius:5px; } .bulk-item:hover { background:#173264; } .bulk-item input { width:auto; flex:0 0 auto; } .bulk-item code { color:var(--text); font-size:12px; }
    .err { border-radius:5px; padding:3px 7px; font-size:11px; white-space:nowrap; } .err-hard { color:var(--red); border:1px solid #77383f; } .err-quota { color:#ffb45e; border:1px solid #826125; } .err-rate { color:var(--amber); border:1px solid #826125; } .err-soft { color:#7fc1ff; border:1px solid #3276c7; }
    .model-group-list { display:grid; gap:10px; margin-top:14px; } .model-group-item { border:1px solid var(--line); border-radius:9px; padding:12px; background:var(--panel2); } .model-group-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; } .model-group-members { margin-top:8px; } .route-checks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:8px; } .route-checks label { display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:7px; padding:8px; color:var(--text); } .route-checks input { width:auto; } .compare-results { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-top:14px; } .answer-card { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:14px; min-height:150px; } .answer-card pre { white-space:pre-wrap; word-break:break-word; margin:10px 0 0; color:var(--text); font:13px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } .answer-meta { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:11px; }
    @media(max-width:1050px) { .app { grid-template-columns:190px minmax(0,1fr); } main { padding:24px; } .grid { grid-template-columns:1fr; } .capability-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:720px) { .app { display:block; } aside { display:none; } header { align-items:flex-start; flex-direction:column; } .header-actions { width:100%; justify-content:space-between; } .stats, .endpoint-grid, .form-grid, .provider-grid { grid-template-columns:1fr 1fr; } .card { overflow:auto; } table { min-width:900px; } }
  </style>
</head>
<body>
<div class="app">
  <aside><div class="brand"><span>✦</span> FreeLLM Gateway</div><nav>
    <button class="nav-item" data-view="overview" data-i18n="overview">概览</button><button class="nav-item active" data-view="models" data-i18n="models">模型池</button><button class="nav-item" data-view="routing" data-i18n="routing">请求路由</button><button class="nav-item" data-view="orchestration" data-i18n="orchestration">多模型</button><button class="nav-item" data-view="health" data-i18n="health">健康监控</button><button class="nav-item" data-view="catalog" data-i18n="catalog">目录同步</button><button class="nav-item" data-view="settings" data-i18n="settings">设置</button>
  </nav></aside>
  <main>
    <header><div><p class="eyebrow">LOCAL CONTROL PLANE</p><h1 id="page-title">模型池</h1></div><div class="header-actions"><span class="service-pill" data-i18n="online">● 本地网关在线</span><button class="small" id="language-toggle" data-action="language">EN</button><button class="primary" data-action="add-model" data-i18n="addModelBtn">＋ 添加模型</button></div></header>
    <div id="message" hidden></div>
    <section id="view-overview" class="view"><div class="stats"><div class="card stat"><b id="stat-configured">—</b><span class="muted" data-i18n="statConfigured">已配置</span></div><div class="card stat"><b id="stat-enabled">—</b><span class="muted" data-i18n="statEnabled">启用</span></div><div class="card stat"><b id="stat-healthy">—</b><span class="muted" data-i18n="statHealthy">健康</span></div><div class="card stat"><b id="stat-capabilities">—</b><span class="muted" data-i18n="statCapabilities">能力</span></div></div><div class="grid" style="margin-top:18px"><section class="card"><h2 data-i18n="ovExternal">外部接口</h2><p class="muted" data-i18n="ovExternalDesc">在你的应用里使用下面的 OpenAI 兼容接口。</p><div class="endpoint-grid"><div class="endpoint"><span class="muted" data-i18n="epBase">接口地址</span><br><code id="api-base"></code></div><div class="endpoint"><span class="muted" data-i18n="epModels">模型列表</span><br><code>/v1/models</code></div><div class="endpoint"><span class="muted" data-i18n="epChat">对话</span><br><code>/v1/chat/completions</code></div><div class="endpoint"><span class="muted" data-i18n="epImages">生图</span><br><code>/v1/images/generations</code></div></div><p class="muted" data-i18n-html="authLine"></p></section><section class="card"><h2 data-i18n="ovRouting">自动路由</h2><div class="flow"><span>◉<small data-i18n="flowRequest">请求</small></span>→<span>⌕<small data-i18n="flowCap">能力</small></span>→<span>♢<small data-i18n="flowHealth">健康</small></span>→<span>≡<small data-i18n="flowPriority">优先级</small></span>→<span>↻<small data-i18n="flowFailover">故障切换</small></span></div><p class="muted" data-i18n="ovRoutingDesc"></p></section></div></section>
    <section id="view-models" class="view active"><div class="toolbar"><div class="muted" data-i18n="modelsDesc"></div><div class="actions"><button data-action="refresh" data-i18n="refresh">刷新</button><button data-action="export" data-i18n="exportCatalog">导出目录</button></div></div><section class="card"><table><thead><tr><th data-i18n="thPriority"></th><th data-i18n="thModel"></th><th data-i18n="thProvider"></th><th data-i18n="thCapabilities"></th><th data-i18n="thStatus"></th><th data-i18n="thActions"></th></tr></thead><tbody id="routes"><tr><td colspan="6" class="empty" data-i18n="loadingRoutes">正在加载模型路由…</td></tr></tbody></table></section></section>
    <section id="view-routing" class="view"><div class="grid"><section class="card"><h2 data-i18n="routeCapTitle"></h2><p class="muted" data-i18n="routeCapDesc"></p><div id="capabilities" class="capability-grid"></div></section><section class="card"><h2 data-i18n="routeRulesTitle"></h2><div class="rule"><span data-i18n="ruleText"></span> <i class="toggle"></i></div><div class="rule"><span data-i18n="ruleLong"></span> <i class="toggle"></i></div><div class="rule"><span data-i18n="ruleVision"></span> <i class="toggle"></i></div><div class="rule"><span data-i18n="ruleImage"></span> <i class="toggle"></i></div></section></div></section>
    <section id="view-orchestration" class="view">
      <div class="toolbar"><div class="muted" data-i18n="orchestrationDesc"></div><div class="actions"><button data-action="refresh-groups" data-i18n="refresh"></button></div></div>
      <div class="grid">
        <section class="card">
          <h2 data-i18n="groupCreateTitle"></h2>
          <form id="group-form">
            <div class="form-grid">
              <label><span data-i18n="groupName"></span><input name="name" required data-i18n-ph="groupNamePh"></label>
              <label><span data-i18n="groupStrategy"></span><select name="strategy"><option value="parallel">parallel</option><option value="fallback">fallback</option><option value="single">single</option></select></label>
              <label><span data-i18n="groupTimeout"></span><input name="timeout_ms" type="number" min="100" value="60000"></label>
              <label><span data-i18n="groupConcurrency"></span><input name="max_concurrency" type="number" min="1" value="4"></label>
            </div>
            <label style="margin-top:13px"><span data-i18n="groupModels"></span><div id="group-route-checks" class="route-checks"></div></label>
            <div class="form-actions"><button class="primary" type="submit" data-i18n="groupCreate"></button></div>
          </form>
          <div id="model-groups" class="model-group-list"></div>
        </section>
        <section class="card">
          <h2 data-i18n="compareTitle"></h2>
          <p class="muted" data-i18n="compareDesc"></p>
          <label><span data-i18n="compareGroup"></span><select id="compare-group"></select></label>
          <label style="margin-top:12px"><span data-i18n="comparePrompt"></span><textarea id="compare-prompt" rows="8" data-i18n-ph="comparePromptPh"></textarea></label>
          <div class="form-actions"><button class="primary" data-action="run-group" data-i18n="compareRun"></button></div>
          <div id="compare-results" class="compare-results"><div class="muted" data-i18n="compareEmpty"></div></div>
        </section>
      </div>
    </section>
    <section id="view-health" class="view"><div class="toolbar"><div class="muted" data-i18n="healthDesc"></div><div class="actions"><button class="primary" data-action="probe-all" data-i18n="probeAll"></button><button data-action="refresh" data-i18n="refresh"></button></div></div><section class="card"><table><thead><tr><th data-i18n="thModel"></th><th data-i18n="thStatus"></th><th data-i18n="thLastLatency"></th><th data-i18n="thFailures"></th><th data-i18n="thLastError"></th><th data-i18n="thAction"></th></tr></thead><tbody id="health-routes"></tbody></table></section></section>
    <section id="view-catalog" class="view"><div class="toolbar"><div class="muted" data-i18n="catalogDesc"></div><div class="actions"><button class="primary" data-action="source" data-i18n="loadCatalog"></button><button data-action="export" data-i18n="exportCatalog"></button><button data-action="sync" data-i18n="syncSite"></button></div></div><div id="catalog-result" class="notice" hidden></div><section class="card"><div class="toolbar"><h2 data-i18n="discoverTitle" style="margin:0"></h2><div class="actions"><input id="catalog-search" data-i18n-ph="searchPh" style="width:230px" aria-label="search"><a class="ghost" href="https://freellm.top" target="_blank" rel="noopener noreferrer" data-i18n="visitSite"></a></div></div><p class="muted" id="source-label" style="margin:0 0 6px"></p><table><thead><tr><th data-i18n="thProvider"></th><th data-i18n="thModel"></th><th data-i18n="thFree"></th><th data-i18n="thType"></th><th data-i18n="thRegister"></th><th data-i18n="thActions"></th></tr></thead><tbody id="source-offers"><tr><td colspan="6" class="empty" data-i18n="catalogEmpty"></td></tr></tbody></table></section><section class="card" style="margin-top:18px"><h2 data-i18n="policyTitle"></h2><div class="rule"><span data-i18n="policy1"></span><span class="muted" data-i18n="policy1m"></span></div><div class="rule"><span data-i18n="policy2"></span><span class="muted" data-i18n="policy2m"></span></div><div class="rule"><span data-i18n="policy3"></span><span class="muted" data-i18n="policy3m"></span></div><div class="rule"><span data-i18n="policy4"></span><span class="muted" data-i18n="policy4m"></span></div></section></section>
    <section id="view-settings" class="view"><div class="grid"><section class="card"><h2 data-i18n="setTitle"></h2><div class="endpoint-grid"><div class="endpoint"><span class="muted" data-i18n="epGateway"></span><br><code id="settings-origin"></code></div><div class="endpoint"><span class="muted" data-i18n="epOpenAPI"></span><br><code id="settings-docs"></code></div><div class="endpoint"><span class="muted" data-i18n="epHealth"></span><br><code>/health</code></div><div class="endpoint"><span class="muted" data-i18n="epAdmin"></span><br><code>/api/admin</code></div></div><p class="muted" data-i18n-html="settingsNote"></p></section><section class="card"><h2 data-i18n="providersTitle"></h2><div id="providers" class="provider-grid"></div></section></div><section class="card" style="margin-top:18px"><h2 data-i18n="addProvider"></h2><form id="provider-form"><div class="form-grid"><label><span data-i18n="fProvId"></span><input name="id" required placeholder="groq"></label><label><span data-i18n="fProvName"></span><input name="name" required placeholder="Groq"></label><label><span data-i18n="fBaseUrl"></span><input name="base_url" required placeholder="https://api.example/v1"></label><label><span data-i18n="fOfficial"></span><input name="official_url" required placeholder="https://example.com"></label></div><div class="form-actions"><button class="primary" type="submit" data-i18n="saveProvider"></button></div></form></section></section>
  </main>
</div>
<div id="auth-gate" class="auth-gate" hidden><section class="card auth-card"><h2 data-i18n="authTitle"></h2><p class="muted" data-i18n="authDesc"></p><form id="auth-form" class="auth-form"><input id="auth-token" type="password" autocomplete="off" data-i18n-ph="authPh" aria-label="Admin token"><button class="primary" type="submit" data-i18n="authBtn"></button></form><p id="auth-error" class="auth-error" role="alert"></p></section></div>
<div id="route-modal" class="modal-layer" hidden><section class="card modal"><h2 id="route-modal-title" data-mode="add"></h2><form id="route-form"><input type="hidden" name="id"><div class="form-grid"><label><span data-i18n="fProvider"></span><div class="inline-field"><select name="provider_id" id="route-provider" required></select><a id="register-provider" class="ghost" data-action="register-provider" href="#" target="_blank" rel="noopener noreferrer" hidden data-i18n="registerProvider"></a></div><small id="provider-hint" class="muted" data-i18n="providerRequired" hidden></small></label><label><span data-i18n="fRemote"></span><div class="inline-field"><input name="remote_model" list="provider-models" required data-i18n-ph="fRemotePh"><button type="button" class="small" data-action="fetch-models" data-i18n="fetchModels"></button></div><datalist id="provider-models"></datalist><div id="bulk-models" class="bulk-picker" hidden></div><small id="provider-model-count" class="muted"></small></label><label><span data-i18n="fDisplay"></span><input name="display_name" data-i18n-ph="fDisplayPh"></label><label><span data-i18n="fPriority"></span><input name="priority" type="number" min="1" required></label><label><span data-i18n="fRegUrl"></span><input name="public_url" data-i18n-ph="fRegPh"></label><label><span data-i18n="fDocs"></span><input name="public_docs_url" data-i18n-ph="fDocsPh"></label><label style="grid-column:1/-1"><span data-i18n="fFree"></span><textarea name="free_summary" data-i18n-ph="fFreePh"></textarea></label><label style="grid-column:1/-1"><span data-i18n="fCred"></span><input name="credential" type="password" autocomplete="new-password"><small class="muted" data-i18n="fCredHint"></small></label></div><label style="margin-top:13px"><span data-i18n="fCaps"></span><div class="checks"><label><input type="checkbox" name="capabilities" value="chat" checked> <span data-i18n="capChat"></span></label><label><input type="checkbox" name="capabilities" value="long_context"> <span data-i18n="capLong"></span></label><label><input type="checkbox" name="capabilities" value="vision"> <span data-i18n="capVision"></span></label><label><input type="checkbox" name="capabilities" value="image_generation"> <span data-i18n="capImage"></span></label></div></label><div class="form-actions"><button type="button" data-action="close-modal" data-i18n="cancel"></button><button class="primary" type="submit" data-action="bulk-save-models" data-i18n="saveModel"></button></div></form></section></div>
<script>
  const state={routes:[],providers:[],overview:null,sourceOffers:[],catalogProviders:[],selectedOffer:null,groups:[],executionPolicies:[]}; let language=localStorage.getItem('freellm_gateway_language')||'zh';
  const I18N={
    overview:['概览','Overview'],models:['模型池','Model Pool'],routing:['请求路由','Request Routing'],orchestration:['多模型','Multi-model'],health:['健康监控','Health Monitor'],catalog:['目录同步','Catalog Sync'],settings:['设置','Settings'],

  const t=key=>{const entry=I18N[key];return entry?(language==='zh'?entry[0]:entry[1]):key;};
  const fmt=(key,vars)=>Object.entries(vars||{}).reduce((text,[k,v])=>text.replace('{'+k+'}',v),t(key));
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); const tokenValue=()=>sessionStorage.getItem('freellm_admin_token')||'';
  const api=async(path,options={})=>{const headers={'Authorization':'Bearer '+tokenValue(),...(options.headers||{})};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const response=await fetch(path,{...options,headers});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.detail||`HTTP ${response.status}`);return body;};
  const showMessage=(text,type='notice')=>{const node=document.querySelector('#message');node.textContent=text;node.className=type;node.hidden=false;window.setTimeout(()=>{node.hidden=true;},5000);}; const routeStatusClass=health=>health==='healthy'?'ok':['slow','rate_limited','quota_exhausted','cooldown'].includes(health)?'slow':'bad'; const tags=caps=>(caps||[]).map(cap=>`<span class="tag ${cap.includes('image')||cap==='vision'?'image':''}">${esc(cap)}</span>`).join('');
  const errClass=kind=>({quota_exhausted:'err-quota',rate_limit:'err-rate',timeout:'err-soft',network_error:'err-soft',provider_5xx:'err-soft'}[kind]||'err-hard');
  const errBadge=(detail)=>{const kind=detail.last_error_kind;if(!kind)return '—';return `<span class="err ${errClass(kind)}">${esc(kind)}</span>${detail.last_error_retryable?' <span class="muted" title="retryable">⟳</span>':''}${detail.last_retry_after?` <small class="muted">+${Math.round(detail.last_retry_after)}s</small>`:''}`;};
  const renderStats=()=>{const data=state.overview?.data||{};document.querySelector('#stat-configured').textContent=data.configured??state.routes.length;document.querySelector('#stat-enabled').textContent=data.enabled??state.routes.filter(x=>x.enabled).length;document.querySelector('#stat-healthy').textContent=data.healthy??state.routes.filter(x=>x.health==='healthy').length;document.querySelector('#stat-capabilities').textContent=(data.capabilities||[]).length;};
  const renderRoutes=()=>{const body=document.querySelector('#routes');if(!state.routes.length){body.innerHTML=`<tr><td colspan="6" class="empty">${t('noRoutes')}</td></tr>`;return;}body.innerHTML=state.routes.map((route,index)=>`<tr><td>${route.priority}</td><td><b>${esc(route.display_name||route.remote_model)}</b><small>${esc(route.remote_model)}</small></td><td>${esc(route.provider_name||route.provider_id)}</td><td>${tags(route.capabilities)}</td><td><span class="status ${routeStatusClass(route.health)}">${esc(route.health)}${route.enabled?'':' · '+t('disable').toLowerCase()}</span></td><td><div class="row-actions"><button class="small" data-action="move-up" data-route="${esc(route.id)}" ${index===0?'disabled':''}>↑</button><button class="small" data-action="move-down" data-route="${esc(route.id)}" ${index===state.routes.length-1?'disabled':''}>↓</button><button class="small" data-action="probe" data-route="${esc(route.id)}">${t('probe')}</button><button class="small" data-action="edit" data-route="${esc(route.id)}">${t('edit')}</button><button class="small" data-action="toggle" data-route="${esc(route.id)}">${route.enabled?t('disable'):t('enable')}</button><button class="small danger" data-action="delete" data-route="${esc(route.id)}">${t('del')}</button></div></td></tr>`).join('');};
  const renderHealth=()=>{const body=document.querySelector('#health-routes');body.innerHTML=state.routes.length?state.routes.map(route=>{const detail=route.health_detail||{};return `<tr><td><b>${esc(route.display_name||route.remote_model)}</b><small>${esc(route.provider_name||route.provider_id)}</small></td><td><span class="status ${routeStatusClass(route.health)}">${esc(route.health)}</span></td><td>${detail.last_total_ms==null?'—':esc(detail.last_total_ms+' ms')}</td><td>${esc(detail.consecutive_failures||0)}</td><td>${errBadge(detail)}</td><td><button class="small" data-action="probe" data-route="${esc(route.id)}">${t('probe')}</button></td></tr>`}).join(''):`<tr><td colspan="6" class="empty">${t('noRoutes')}</td></tr>`;};
  const renderCapabilities=()=>{const caps=['chat','long_context','vision','image_generation'];document.querySelector('#capabilities').innerHTML=caps.map(cap=>`<div class="endpoint capability"><b>${state.routes.filter(route=>(route.capabilities||[]).includes(cap)).length}</b><span class="muted">${esc(cap)}</span><small class="muted">${t('autoByPriority')}</small></div>`).join('');};
  const policyForGroup=group=>state.executionPolicies.find(policy=>policy.id===group.policy_id)||null;
  const renderGroupRouteChecks=()=>{const node=document.querySelector('#group-route-checks');if(!node)return;node.innerHTML=state.routes.length?state.routes.map(route=>`<label><input type="checkbox" value="${esc(route.id)}" data-group-route> <span><b>${esc(route.display_name||route.remote_model)}</b><small>${esc(route.provider_name||route.provider_id)} · ${esc(route.id)}</small></span></label>`).join(''):`<div class="muted">${t('groupNoRoutes')}</div>`;};
  const renderModelGroups=()=>{const node=document.querySelector('#model-groups');if(!node)return;node.innerHTML=state.groups.length?state.groups.map(group=>{const policy=policyForGroup(group);const members=group.members||[];return `<div class="model-group-item"><div class="model-group-head"><div><b>${esc(group.name)}</b><small>${esc(policy?.strategy||'—')} · ${fmt('groupMembers',{n:members.length})}</small></div><div class="row-actions"><button class="small" data-action="select-group" data-group="${esc(group.id)}">${t('compareTitle')}</button><button class="small danger" data-action="delete-group" data-group="${esc(group.id)}">${t('del')}</button></div></div><div class="model-group-members">${members.map(member=>`<span class="tag">${esc(routeById(member.route_id)?.display_name||routeById(member.route_id)?.remote_model||member.route_id)}</span>`).join('')}</div></div>`;}).join(''):`<div class="muted">${t('groupNoGroups')}</div>`;const select=document.querySelector('#compare-group');if(select){const current=select.value;select.innerHTML=state.groups.map(group=>`<option value="${esc(group.id)}">${esc(group.name)}</option>`).join('');if(state.groups.some(group=>group.id===current))select.value=current;}renderGroupRouteChecks();};
  const loadOrchestration=async()=>{const [groups,policies]=await Promise.all([api('/api/admin/model-groups'),api('/api/admin/execution-policies')]);state.groups=groups.data||[];state.executionPolicies=policies.data||[];renderModelGroups();};
  const answerText=response=>{const content=response?.choices?.[0]?.message?.content??response?.choices?.[0]?.text;if(typeof content==='string')return content;if(Array.isArray(content))return content.map(part=>part?.text||'').join('');return JSON.stringify(response??{},null,2);};
  const renderCompareResult=result=>{const node=document.querySelector('#compare-results');if(!node)return;const items=result?.results||[];node.innerHTML=items.length?items.map(item=>{const route=routeById(item.route_id);const title=route?.display_name||route?.remote_model||item.route_id;const provider=route?.provider_name||route?.provider_id||item.route_id;const failed=item.status!=='succeeded';return `<article class="answer-card"><div class="answer-meta"><b>${esc(title)}</b><span class="status ${failed?'bad':'ok'}">${esc(item.status)} · ${esc(item.latency_ms)} ms</span></div><small class="muted">${esc(provider)}</small><pre>${esc(failed?(item.error_detail||item.error_kind||'failed'):answerText(item.response))}</pre></article>`;}).join(''):`<div class="muted">${t('compareEmpty')}</div>`;};
  const runSelectedGroup=async()=>{const groupId=document.querySelector('#compare-group').value;const prompt=document.querySelector('#compare-prompt').value.trim();if(!groupId)throw new Error(t('compareNeedGroup'));if(!prompt)throw new Error(t('compareNeedPrompt'));const node=document.querySelector('#compare-results');node.innerHTML=`<div class="muted">${t('compareRunning')}</div>`;const result=await api('/api/admin/model-groups/'+encodeURIComponent(groupId)+'/execute',{method:'POST',body:JSON.stringify({messages:[{role:'user',content:prompt}]})});renderCompareResult(result);};

  const providerRoutes=provider=>state.routes.filter(route=>route.provider_id===provider.id);
  const renderProviderModels=provider=>{const routes=providerRoutes(provider);if(!routes.length)return `<div class="provider-model-list muted">${t('noProviderModels')}</div>`;return `<div class="provider-model-list">${routes.map(route=>`<div class="provider-model-row"><div><b>${esc(route.display_name||route.remote_model)}</b><small>${esc(route.remote_model)}</small></div><div>${tags(route.capabilities)}</div><span class="status ${routeStatusClass(route.health)}">${esc(route.health)}${route.enabled?'':' · '+t('disable').toLowerCase()}</span></div>`).join('')}</div>`;};
  const renderProviders=()=>{const node=document.querySelector('#providers');node.innerHTML=state.providers.length?state.providers.map(provider=>`<div class="endpoint"><b>${esc(provider.name)}</b><small>${esc(provider.id)} · ${esc(provider.protocol)}</small><small>${esc(provider.base_url)}</small>${renderProviderModels(provider)}<button class="small" data-action="discover" data-provider="${esc(provider.id)}" style="margin-top:9px">${t('discoverBtn')}</button></div>`).join(''):`<div class="muted">${t('noProviders')}</div>`;};
  const safeLink=value=>/^https:\/\//.test(value||'')?value:'#';
  const providerIdFor=name=>String(name||'provider').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'provider';
  const providerBaseUrl=endpoint=>String(endpoint||'').replace(/\/chat\/completions\/?$/,'');
  const buildCatalogProviders=()=>{const providers=new Map();(state.sourceOffers||[]).forEach(offer=>{const endpoint=offer.apiEndpoint||offer.usageGuide?.endpoint;if(!/^https:\/\/[^\s]+\/chat\/completions\/?$/.test(endpoint||''))return;const name=String(offer.provider||offer.name||'').trim();if(!name)return;const id=providerIdFor(name);if(providers.has(id))return;providers.set(id,{id,name,protocol:'openai',base_url:providerBaseUrl(endpoint),official_url:offer.register||'',offer});});return Array.from(providers.values()).filter(provider=>safeLink(provider.official_url)!=='#');};
  const catalogProviderFor=offer=>{const target=String(offer?.provider||'').trim().toLowerCase();return state.catalogProviders.find(provider=>{const name=String(provider.name||'').trim().toLowerCase();return target&&(name===target||name.includes(target)||target.includes(name));})||null;};
  const providerChoices=()=>{const localIds=new Set(state.providers.map(provider=>provider.id));return [...state.providers.map(provider=>({...provider,catalog:false})),...state.catalogProviders.filter(provider=>!localIds.has(provider.id)).map(provider=>({...provider,catalog:true}))];};
  const selectedProvider=()=>{const id=document.querySelector('#route-form').elements.provider_id.value;return providerChoices().find(provider=>provider.id===id)||null;};
  const updateRegisterLink=offer=>{const form=document.querySelector('#route-form');const provider=selectedProvider();const link=document.querySelector('#register-provider');const href=safeLink(offer?.register||provider?.official_url);link.href=href;link.hidden=href==='#';};
  const applyProviderMetadata=provider=>{if(!provider||document.querySelector('#route-form').elements.id.value)return;const offer=provider.offer;state.selectedOffer=offer||null;const form=document.querySelector('#route-form');if(offer){form.elements.public_url.value=offer.register||provider.official_url||'';form.elements.public_docs_url.value=offer.docsUrl||offer.usageGuide?.docsUrl||'';form.elements.free_summary.value=[offer.freeSummary,offer.accessSummary].filter(Boolean).join(' · '); }updateRegisterLink(state.selectedOffer);};
  const renderSourceOffers=()=>{const node=document.querySelector('#source-offers');const query=(document.querySelector('#catalog-search')?.value||'').trim().toLowerCase();const rows=(state.sourceOffers||[]).filter(offer=>!query||[offer.name,offer.provider,offer.model,offer.productType].some(value=>String(value||'').toLowerCase().includes(query)));node.innerHTML=rows.length?rows.map(offer=>{const registerLink=safeLink(offer.register);const docsLink=safeLink(offer.docsUrl);return `<tr><td><div class="provider-cell"><span class="mark">${esc(String(offer.providerMark||offer.provider||'?').slice(0,2).toUpperCase())}</span><div><b>${esc(offer.provider||'—')}</b><small>${esc(offer.providerMeta||offer.id||'')}</small></div></div></td><td><b>${esc(offer.name||offer.id)}</b><small>${esc([offer.model,offer.modelMeta].filter(Boolean).join(' · ')||'—')}</small></td><td>${esc(offer.freeSummary||'—')}<small>${esc(offer.accessSummary||'')}</small></td><td>${tags([offer.productType].filter(Boolean))}</td><td>${registerLink!=='#'?`<a class="btn" href="${esc(registerLink)}" target="_blank" rel="noopener noreferrer">${t('registerBtn')}</a>`:'—'}${docsLink!=='#'?`<small><a href="${esc(docsLink)}" target="_blank" rel="noopener noreferrer">${t('docsLink')}</a></small>`:''}</td><td><button class="small primary" data-action="add-offer" data-offer="${esc(offer.id)}">${t('addPool')}</button></td></tr>`;}).join(''):`<tr><td colspan="6" class="empty">${t(query?'catalogEmptyFiltered':'catalogEmpty')}</td></tr>`;};
  const loadSourceCatalog=async()=>{const result=await api('/api/admin/catalog/source?scope=models');state.sourceOffers=result.data||[];state.catalogProviders=buildCatalogProviders();let host=result.source;try{host=new URL(result.source).host;}catch(error){}document.querySelector('#source-label').textContent=`${host} · ${fmt('sourceCount',{n:state.sourceOffers.length})}`;renderSourceOffers();};
  const renderAll=()=>{renderStats();renderRoutes();renderHealth();renderCapabilities();renderProviders();const origin=location.origin;document.querySelector('#api-base').textContent=origin+'/v1';document.querySelector('#settings-origin').textContent=origin+'/v1';document.querySelector('#settings-docs').textContent=origin+'/docs';};
  const loadAll=async()=>{const [overview,routes,providers]=await Promise.all([api('/api/admin/overview'),api('/api/admin/routes'),api('/api/admin/providers')]);state.overview=overview;state.routes=routes.data||[];state.providers=providers.data||[];renderAll();};
  const applyLanguage=()=>{document.documentElement.lang=language==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=t(node.dataset.i18n);});document.querySelectorAll('[data-i18n-html]').forEach(node=>{node.innerHTML=t(node.dataset.i18nHtml);});document.querySelectorAll('[data-i18n-ph]').forEach(node=>{node.placeholder=t(node.dataset.i18nPh);});const view=document.querySelector('.view.active')?.id?.replace('view-','')||'models';document.querySelector('#page-title').textContent=t(view);document.querySelector('#language-toggle').textContent=language==='zh'?'EN':'中文';const modal=document.querySelector('#route-modal-title');if(modal)modal.textContent=t(modal.dataset.mode==='edit'?'mEdit':'mAdd');};
  const showView=view=>{document.querySelectorAll('.view').forEach(node=>node.classList.toggle('active',node.id==='view-'+view));document.querySelectorAll('.nav-item').forEach(node=>node.classList.toggle('active',node.dataset.view===view));document.querySelector('#page-title').textContent=t(view);if(view==='catalog'&&!document.querySelector('#source-offers').dataset.loaded){loadSourceCatalog().then(()=>{document.querySelector('#source-offers').dataset.loaded='true';}).catch(error=>showMessage(error.message,'error'));}if(view==='orchestration'){loadOrchestration().catch(error=>showMessage(error.message,'error'));}};
  const closeModal=()=>{document.querySelector('#route-modal').hidden=true;document.querySelector('#route-form').reset();};
  const renderBulkModels=models=>{const unique=[...new Set((models||[]).filter(model=>typeof model==='string'&&model.trim()).map(model=>model.trim()))];const node=document.querySelector('#bulk-models');if(!unique.length){node.hidden=true;node.innerHTML='';return;}node.innerHTML=`<div class="bulk-toolbar"><button type="button" class="small" data-action="select-all-models">${t('selectAllModels')}</button><button type="button" class="small" data-action="select-none-models">${t('selectNoModels')}</button><span class="muted">${fmt('modelsFetched',{n:unique.length})}</span></div><div class="bulk-list">${unique.map(model=>`<label class="bulk-item"><input type="checkbox" data-bulk-model="${esc(model)}" checked><code>${esc(model)}</code></label>`).join('')}</div>`;node.hidden=false;};
  const ensureProvider=async()=>{const provider=selectedProvider();if(!provider)throw new Error(t('providerRequired'));const existing=state.providers.find(item=>item.id===provider.id);if(existing)return existing;const saved=await api('/api/admin/providers',{method:'POST',body:JSON.stringify({id:provider.id,name:provider.name,protocol:provider.protocol,base_url:provider.base_url,official_url:provider.official_url})});state.providers=[...state.providers.filter(item=>item.id!==saved.id),saved];renderProviders();return saved;};
  const openRouteModal=async(route,offer)=>{const form=document.querySelector('#route-form');if(!route&&!state.sourceOffers.length){try{await loadSourceCatalog();}catch(error){showMessage(error.message,'error');}}form.reset();state.selectedOffer=offer||null;const modalTitle=document.querySelector('#route-modal-title');modalTitle.dataset.mode=route?'edit':'add';modalTitle.textContent=t(route?'mEdit':'mAdd');form.elements.id.value=route?.id||'';form.elements.remote_model.value=route?.remote_model||offer?.model||'';form.elements.display_name.value=route?.display_name||offer?.name||'';form.elements.priority.value=route?.priority||state.routes.length+1;form.elements.public_url.value=route?.public_url||offer?.register||'';form.elements.public_docs_url.value=route?.public_docs_url||offer?.docsUrl||offer?.usageGuide?.docsUrl||'';form.elements.free_summary.value=route?.free_summary||[offer?.freeSummary,offer?.accessSummary].filter(Boolean).join(' · ')||'';const catalogMatch=offer&&catalogProviderFor(offer);const matched=route?null:state.providers.find(provider=>{const a=String(provider.name||'').toLowerCase(),b=String(offer?.provider||'').toLowerCase();return b&&(a===b||a.includes(b)||b.includes(a));});const choices=providerChoices();const recommended=state.catalogProviders.find(provider=>provider.id==='openrouter')?.id;form.elements.provider_id.innerHTML=choices.map(provider=>`<option value="${esc(provider.id)}">${esc(provider.name)}${provider.catalog?' · 目录':''} (${esc(provider.id)})</option>`).join('');form.elements.provider_id.value=route?.provider_id||matched?.id||catalogMatch?.id||recommended||state.catalogProviders[0]?.id||state.providers[0]?.id||'';document.querySelector('#provider-hint').hidden=choices.length>0;document.querySelector('#provider-models').innerHTML='';document.querySelector('#provider-model-count').textContent='';document.querySelector('#bulk-models').hidden=true;document.querySelector('#bulk-models').innerHTML='';if(!route&&!offer&&selectedProvider()?.catalog)applyProviderMetadata(selectedProvider());updateRegisterLink(state.selectedOffer);form.elements.id.disabled=Boolean(route);form.querySelectorAll('input[name="capabilities"]').forEach(input=>input.checked=(route?.capabilities||['chat']).includes(input.value));document.querySelector('#route-modal').hidden=false;};
  const fetchProviderModels=async target=>{const form=document.querySelector('#route-form');if(!form.elements.provider_id.value){showMessage(t('providerRequired'),'error');return;}const credential=form.elements.credential.value.trim();if(!credential){showMessage(t('credentialRequired'),'error');return;}target.disabled=true;target.textContent='…';try{await ensureProvider();const providerId=form.elements.provider_id.value;const result=await api('/api/admin/providers/'+encodeURIComponent(providerId)+'/models',{method:'POST',body:JSON.stringify({credential})});const models=result.data||[];document.querySelector('#provider-models').innerHTML=models.map(model=>`<option value="${esc(model)}"></option>`).join('');renderBulkModels(models);document.querySelector('#provider-model-count').textContent=fmt('modelsFetched',{n:models.length});if(!form.elements.remote_model.value&&models[0])form.elements.remote_model.value=models[0];}finally{target.disabled=false;target.textContent=t('fetchModels');}};
  const routeById=id=>state.routes.find(route=>route.id===id);
  const refresh=async()=>{try{await loadAll();}catch(error){showMessage(error.message,'error');}};
  document.addEventListener('click',async event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action;try{if(action==='close-modal'){closeModal();return;}if(action==='add-model'){await openRouteModal();return;}if(action==='add-offer'){const offer=(state.sourceOffers||[]).find(item=>item.id===target.dataset.offer);if(offer)await openRouteModal(null,offer);return;}if(action==='select-all-models'||action==='select-none-models'){document.querySelectorAll('[data-bulk-model]').forEach(input=>input.checked=action==='select-all-models');return;}if(action==='fetch-models'){await fetchProviderModels(target);return;}if(action==='source'){await loadSourceCatalog();document.querySelector('#source-offers').dataset.loaded='true';return;}if(action==='refresh'){await refresh();return;}if(action==='refresh-groups'){await loadOrchestration();return;}if(action==='run-group'){await runSelectedGroup();return;}if(action==='select-group'){document.querySelector('#compare-group').value=target.dataset.group;document.querySelector('#compare-prompt').focus();return;}if(action==='delete-group'){if(!window.confirm(t('groupDeleteConfirm')))return;await api('/api/admin/model-groups/'+encodeURIComponent(target.dataset.group),{method:'DELETE'});showMessage(t('groupDeleted'),'success');await loadOrchestration();return;}if(action==='edit'){await openRouteModal(routeById(target.dataset.route));return;}if(action==='discover'){target.textContent='…';const result=await api('/api/admin/providers/'+encodeURIComponent(target.dataset.provider)+'/discover',{method:'POST'});showMessage(fmt('msgDiscovered',{n:(result.data||[]).length}),'success');await refresh();return;}if(action==='delete'){if(!window.confirm(t('confirmDelete')))return;await api('/api/admin/routes/'+encodeURIComponent(target.dataset.route),{method:'DELETE'});showMessage(t('msgDeleted'),'success');await refresh();return;}if(action==='toggle'){const route=routeById(target.dataset.route);await api('/api/admin/routes/'+encodeURIComponent(route.id),{method:'PATCH',body:JSON.stringify({enabled:!route.enabled})});await refresh();return;}if(action==='probe'){target.textContent='…';await api('/api/admin/routes/'+encodeURIComponent(target.dataset.route)+'/probe',{method:'POST'});showMessage(t('msgProbed'),'success');await refresh();return;}if(action==='move-up'||action==='move-down'){const index=state.routes.findIndex(route=>route.id===target.dataset.route);const other=action==='move-up'?index-1:index+1;if(other<0||other>=state.routes.length)return;const ids=state.routes.map(route=>route.id);[ids[index],ids[other]]=[ids[other],ids[index]];await api('/api/admin/routes/reorder',{method:'POST',body:JSON.stringify({ids})});await refresh();return;}if(action==='probe-all'){let rateLimitStreak=0;let stopped=false;for(const route of state.routes){try{await api('/api/admin/routes/'+encodeURIComponent(route.id)+'/probe',{method:'POST'});rateLimitStreak=0;}catch(error){if(error.message==='rate_limit'){rateLimitStreak+=1;}else{rateLimitStreak=0;showMessage(`${route.remote_model}: ${error.message}`,'error');}if(rateLimitStreak>=3){stopped=true;break;}}}if(stopped)showMessage(t('probeStoppedRateLimit'),'notice');await refresh();return;}if(action==='export'){const result=await api('/api/admin/catalog/export',{method:'POST'});const data=result.data||{};const box=document.querySelector('#catalog-result');box.textContent=fmt('msgExported',{p:(data.published||[]).length,r:(data.review||[]).length,path:result.path});box.className='notice success';box.hidden=false;showView('catalog');return;}if(action==='sync'){const result=await api('/api/admin/catalog/sync',{method:'POST'});const sync=result.data?.sync||{};const box=document.querySelector('#catalog-result');box.textContent=fmt(sync.changed?'msgSynced':'msgSyncClean',{p:sync.published||0,r:sync.review||0});box.className='notice success';box.hidden=false;return;}}catch(error){showMessage(error.message,'error');await refresh();}});
  document.querySelectorAll('.nav-item').forEach(button=>button.addEventListener('click',()=>showView(button.dataset.view)));
  document.querySelector('#route-provider').addEventListener('change',()=>{applyProviderMetadata(selectedProvider());updateRegisterLink(state.selectedOffer);});
  document.querySelector('#language-toggle').addEventListener('click',()=>{language=language==='zh'?'en':'zh';localStorage.setItem('freellm_gateway_language',language);applyLanguage();renderAll();if(document.querySelector('#source-offers').dataset.loaded)renderSourceOffers();});
  document.querySelector('#catalog-search').addEventListener('input',renderSourceOffers);
  document.querySelector('#route-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const provider=selectedProvider();const common={display_name:form.elements.display_name.value.trim()||null,priority:Number(form.elements.priority.value),public_url:form.elements.public_url.value.trim()||null,public_docs_url:form.elements.public_docs_url.value.trim()||null,free_summary:form.elements.free_summary.value.trim()||null,capabilities:Array.from(form.querySelectorAll('input[name="capabilities"]:checked')).map(input=>input.value)};const credential=form.elements.credential.value.trim();try{const id=form.elements.id.value;if(id){const payload={provider_id:form.elements.provider_id.value,remote_model:form.elements.remote_model.value.trim(),...common};if(credential)payload.credential=credential;await api('/api/admin/routes/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(payload)});closeModal();showMessage(t('msgSaved'),'success');await refresh();return;}if(!provider){showMessage(t('providerRequired'),'error');return;}await ensureProvider();const bulkInputs=Array.from(document.querySelectorAll('#bulk-models [data-bulk-model]'));let result;if(bulkInputs.length){const payload={provider:{id:provider.id,name:provider.name,protocol:provider.protocol,base_url:provider.base_url,official_url:provider.official_url},models:bulkInputs.map(input=>({remote_model:input.dataset.bulkModel,enabled:input.checked})),...common};if(credential)payload.credential=credential;result=await api('/api/admin/routes/bulk',{method:'POST',body:JSON.stringify(payload)});const data=result.data||{};closeModal();showMessage(fmt('bulkSaved',{created:(data.created||[]).length,skipped:(data.skipped||[]).length}),'success');}else{const remoteModel=form.elements.remote_model.value.trim();if(!remoteModel){showMessage(t('bulkNoModels'),'error');return;}const payload={...common,provider_id:provider.id,remote_model:remoteModel};if(credential)payload.credential=credential;const generatedId=provider.id+'-'+remoteModel.toLowerCase().replace(/[^a-z0-9]+/g,'-');await api('/api/admin/routes',{method:'POST',body:JSON.stringify({...payload,id:generatedId})});closeModal();showMessage(t('msgSaved'),'success');}await refresh();}catch(error){showMessage(error.message,'error');}});
  document.querySelector('#group-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const name=form.elements.name.value.trim();const selected=Array.from(document.querySelectorAll('[data-group-route]:checked')).map(input=>input.value);if(!selected.length){showMessage(t('groupNoRoutes'),'error');return;}try{const policy=await api('/api/admin/execution-policies',{method:'POST',body:JSON.stringify({name:name+' policy',strategy:form.elements.strategy.value,timeout_ms:Number(form.elements.timeout_ms.value),max_concurrency:Number(form.elements.max_concurrency.value)})});await api('/api/admin/model-groups',{method:'POST',body:JSON.stringify({name,policy_id:policy.id,members:selected})});form.reset();form.elements.timeout_ms.value='60000';form.elements.max_concurrency.value='4';showMessage(t('groupCreated'),'success');await loadOrchestration();}catch(error){showMessage(error.message,'error');}});
  document.querySelector('#provider-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const payload=Object.fromEntries(new FormData(form));payload.protocol='openai';try{await api('/api/admin/providers',{method:'POST',body:JSON.stringify(payload)});form.reset();showMessage(t('msgProvSaved'),'success');await refresh();}catch(error){showMessage(error.message,'error');}});
  document.querySelector('#auth-form').addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#auth-token');const error=document.querySelector('#auth-error');const value=input.value.trim();if(!value)return;sessionStorage.setItem('freellm_admin_token',value);try{await loadAll();document.querySelector('#auth-gate').hidden=true;error.textContent='';}catch(problem){sessionStorage.removeItem('freellm_admin_token');error.textContent=t('authError');}});
  applyLanguage();
  (async()=>{if(tokenValue()){try{await loadAll();}catch(error){sessionStorage.removeItem('freellm_admin_token');document.querySelector('#auth-gate').hidden=false;}}else{document.querySelector('#auth-gate').hidden=false;}})();
</script>
