name: tests

on:
  push:
    branches:
      - dev
      - main
      - feature/provider-platform-v2
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[test]"
      - name: Compile package
        run: python -m compileall -q freellm_gateway tests
      - name: Check admin JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("freellm_gateway/templates/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("admin.html contains no inline script")
          Path("/tmp/freellm-admin.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/freellm-admin.js
      - name: Run test suite
        run: python -m pytest -q
