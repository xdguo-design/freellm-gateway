name: Python tests

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Check Python and admin JavaScript syntax
        run: |
          python -m compileall -q freellm_gateway
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("freellm_gateway/templates/admin.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*)</script>", html, re.S)
          if match is None:
              raise SystemExit("admin.html script block not found")
          Path("/tmp/freellm-admin.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/freellm-admin.js

      - name: Test
        run: pytest
