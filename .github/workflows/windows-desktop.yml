name: windows-desktop

on:
  push:
    branches:
      - dev
      - main
      - feature/provider-platform-v2
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows desktop release
        shell: powershell
        run: .\scripts\build_desktop.ps1

      - name: Smoke test packaged Python sidecar
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:FREELLM_GATEWAY_HOST = "127.0.0.1"
          $env:FREELLM_GATEWAY_PORT = "18901"
          $env:FREELLM_GATEWAY_API_TOKEN = "ci-api-token"
          $env:FREELLM_GATEWAY_ADMIN_TOKEN = "ci-admin-token"
          $env:FREELLM_GATEWAY_DB = "$env:RUNNER_TEMP\freellm-windows.sqlite3"
          $env:FREELLM_GATEWAY_LOG = "$env:RUNNER_TEMP\freellm-sidecar.log"
          $exe = Join-Path $PWD "desktop\sidecar\freellm-gateway\freellm-gateway.exe"
          if (-not (Test-Path $exe)) { throw "Sidecar executable not found: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18901/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              if (Test-Path $env:FREELLM_GATEWAY_LOG) { Get-Content $env:FREELLM_GATEWAY_LOG }
              throw "Packaged sidecar did not become healthy."
            }
            $admin = Invoke-WebRequest -Uri "http://127.0.0.1:18901/admin/" -UseBasicParsing
            if ($admin.StatusCode -ne 200 -or $admin.Content -notmatch 'id="root"') {
              throw "Packaged sidecar did not serve the React admin."
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Verify NSIS installer exists
        shell: powershell
        run: |
          $installers = @(Get-ChildItem "desktop\src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw "NSIS installer was not produced." }
          $installers | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: freellm-studio-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
