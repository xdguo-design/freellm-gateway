name: release-gate

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-matrix:
    name: Python ${{ matrix.python-version }} full regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Compile
        run: python -m compileall -q freellm_gateway tests scripts desktop/scripts

      - name: Full pytest
        run: python -m pytest -q

  browser-e2e:
    name: Chromium React E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Install pinned browser test runner
        run: npm install --prefix web --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start from source using run.sh
        env:
          FREELLM_GATEWAY_PORT: "18766"
          FREELLM_GATEWAY_API_TOKEN: e2e-api-token
          FREELLM_GATEWAY_ADMIN_TOKEN: e2e-admin-token
          FREELLM_GATEWAY_DB: /tmp/freellm-browser-e2e.sqlite3
        run: |
          sh ./run.sh >/tmp/freellm-browser-e2e.log 2>&1 &
          echo $! > /tmp/freellm-browser-e2e.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(180):
              try:
                  with urlopen("http://127.0.0.1:18766/health", timeout=1) as response:
                      assert response.status == 200
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("source launcher did not become healthy")
          PY

      - name: Run browser E2E
        env:
          FREELLM_E2E_BASE_URL: http://127.0.0.1:18766
        working-directory: web
        run: npx playwright test --config=playwright.config.ts

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure
          path: |
            web/test-results/
            /tmp/freellm-browser-e2e.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop source gateway
        if: always()
        run: |
          if [ -f /tmp/freellm-browser-e2e.pid ]; then
            kill "$(cat /tmp/freellm-browser-e2e.pid)" || true
          fi

  windows-runtime:
    name: Windows source + wheel regression
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Parse PowerShell launch/build scripts
        shell: pwsh
        run: |
          foreach ($file in @("run.ps1", "scripts/build_desktop.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Smoke test Windows run.ps1 from source
        shell: pwsh
        run: |
          $env:FREELLM_GATEWAY_API_TOKEN = "windows-source-api"
          $env:FREELLM_GATEWAY_ADMIN_TOKEN = "windows-source-admin"
          $env:FREELLM_GATEWAY_DB = Join-Path $env:RUNNER_TEMP "windows-source.sqlite3"
          $stdout = Join-Path $env:RUNNER_TEMP "windows-source.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "windows-source.err.log"
          $launcher = Start-Process powershell -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", ".\run.ps1",
            "-NoBrowser", "-Port", "18767"
          ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 180; $i++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18767/health" -TimeoutSec 1
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "run.ps1 did not start a healthy gateway"
            }
            $admin = Invoke-WebRequest "http://127.0.0.1:18767/admin/" -UseBasicParsing
            if ($admin.Content -notmatch '<div id="root"></div>') {
              throw "run.ps1 did not serve the React admin shell"
            }
          } finally {
            taskkill /PID $launcher.Id /T /F 2>$null | Out-Null
          }

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: React checks on Windows
        shell: pwsh
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run typecheck --prefix web
          npm run test --prefix web
          npm run build --prefix web

      - name: Full pytest on Windows
        run: python -m pytest -q

      - name: Build wheel
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP "freellm-wheel"
          New-Item -ItemType Directory -Force $wheelDir | Out-Null
          python -m pip wheel . --no-deps -w $wheelDir

      - name: Smoke test installed wheel in clean Windows venv
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP "freellm-wheel"
          $venv = Join-Path $env:RUNNER_TEMP "freellm-runtime"
          python -m venv $venv
          $runtimePython = Join-Path $venv "Scripts\python.exe"
          $wheel = (Get-ChildItem "$wheelDir\freellm_gateway-*.whl" | Select-Object -First 1).FullName
          & $runtimePython -m pip install $wheel

          $env:FREELLM_GATEWAY_API_TOKEN = "windows-wheel-api"
          $env:FREELLM_GATEWAY_ADMIN_TOKEN = "windows-wheel-admin"
          $env:FREELLM_GATEWAY_DB = Join-Path $env:RUNNER_TEMP "windows-wheel.sqlite3"
          $stdout = Join-Path $env:RUNNER_TEMP "windows-wheel.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "windows-wheel.err.log"
          $gateway = Start-Process $runtimePython -ArgumentList @(
            "-m", "freellm_gateway", "run",
            "--host", "127.0.0.1",
            "--port", "18768",
            "--skip-web-build"
          ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18768/health" -TimeoutSec 1
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "installed wheel did not start"
            }
            $admin = Invoke-WebRequest "http://127.0.0.1:18768/admin/" -UseBasicParsing
            if ($admin.Content -notmatch '<div id="root"></div>') {
              throw "installed wheel does not contain React admin"
            }
            $headers = @{ Authorization = "Bearer windows-wheel-admin" }
            $overview = Invoke-RestMethod "http://127.0.0.1:18768/api/admin/overview" -Headers $headers
            if ($overview.data.admin_base -ne "/api/admin") {
              throw "installed wheel admin API smoke failed"
            }
          } finally {
            if (-not $gateway.HasExited) {
              Stop-Process -Id $gateway.Id -Force
            }
          }

      - name: Upload Windows logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-failure
          path: |
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  desktop-windows:
    name: Windows Tauri desktop build + lifecycle smoke
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build desktop debug application
        shell: pwsh
        run: .\scripts\build_desktop.ps1 -Debug

      - name: Verify desktop artifacts and bundled React
        shell: pwsh
        run: |
          $exe = "desktop\src-tauri\target\debug\freellm-studio.exe"
          if (-not (Test-Path $exe)) {
            throw "Tauri debug executable missing"
          }
          $sidecar = "desktop\src-tauri\binaries\freellm-gateway\freellm-gateway.exe"
          if (-not (Test-Path $sidecar)) {
            throw "PyInstaller sidecar missing"
          }
          $react = "desktop\src-tauri\binaries\freellm-gateway\_internal\freellm_gateway\static\admin\index.html"
          if (-not (Test-Path $react)) {
            throw "React admin missing from packaged sidecar"
          }

      - name: Desktop lifecycle smoke
        shell: pwsh
        run: python desktop\scripts\smoke_test.py --exe desktop\src-tauri\target\debug\freellm-studio.exe

      - name: Upload desktop logs/artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-failure
          path: |
            desktop/src-tauri/target/debug/freellm-studio.exe
            desktop/src-tauri/binaries/freellm-gateway/
          if-no-files-found: ignore
          retention-days: 3

  docker-single-instance:
    name: Docker single-instance persistence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t freellm-gateway:ci .

      - name: Start container with persistent volume
        run: |
          set -eu
          SECRET_KEY="$(python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          printf 'FREELLM_CI_SECRET_KEY=%s\n' "$SECRET_KEY" >> "$GITHUB_ENV"
          docker volume create freellm-gateway-ci-data
          docker run -d             --name freellm-gateway-ci             -p 127.0.0.1:18769:8765             -e FREELLM_GATEWAY_API_TOKEN=ci-cloud-api-token             -e FREELLM_GATEWAY_ADMIN_TOKEN=ci-cloud-admin-token             -e FREELLM_GATEWAY_SECRET_KEY="$SECRET_KEY"             -v freellm-gateway-ci-data:/data             freellm-gateway:ci

      - name: Wait for readiness
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:18769/health/ready"
          last = None
          for _ in range(120):
              try:
                  with urlopen(url, timeout=1) as response:
                      payload = json.loads(response.read().decode())
                  assert payload["status"] == "ok"
                  assert payload["database"] == "ok"
                  assert payload["secret_storage"] == "ok"
                  break
              except Exception as error:
                  last = error
                  time.sleep(0.25)
          else:
              raise SystemExit(f"container did not become ready: {last}")
          PY

      - name: Persist provider route and encrypted credential
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          payload = {
              "provider": {
                  "id": "ci-cloud",
                  "name": "CI Cloud",
                  "protocol": "openai",
                  "base_url": "https://example.invalid/v1",
                  "official_url": "https://example.invalid",
              },
              "models": [{"remote_model": "ci-model"}],
              "credential": "ci-provider-secret-must-not-appear-on-disk",
          }
          request = Request(
              "http://127.0.0.1:18769/api/admin/routes/bulk",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer ci-cloud-admin-token",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urlopen(request, timeout=5) as response:
              assert response.status == 200
          PY

          docker exec -i freellm-gateway-ci python - <<'PY'
          from pathlib import Path
          path = Path("/data/provider-secrets.json")
          assert path.is_file()
          content = path.read_text(encoding="utf-8")
          assert "ci-provider-secret-must-not-appear-on-disk" not in content
          PY

      - name: Restart against the same persistent volume
        run: |
          docker rm -f freellm-gateway-ci
          docker run -d             --name freellm-gateway-ci             -p 127.0.0.1:18769:8765             -e FREELLM_GATEWAY_API_TOKEN=ci-cloud-api-token             -e FREELLM_GATEWAY_ADMIN_TOKEN=ci-cloud-admin-token             -e FREELLM_GATEWAY_SECRET_KEY="$FREELLM_CI_SECRET_KEY"             -v freellm-gateway-ci-data:/data             freellm-gateway:ci

          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          ready = "http://127.0.0.1:18769/health/ready"
          for _ in range(120):
              try:
                  with urlopen(ready, timeout=1) as response:
                      assert response.status == 200
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("restarted container did not become ready")

          request = Request(
              "http://127.0.0.1:18769/api/admin/routes",
              headers={"Authorization": "Bearer ci-cloud-admin-token"},
          )
          with urlopen(request, timeout=5) as response:
              payload = json.loads(response.read().decode())
          assert any(
              route["provider_id"] == "ci-cloud" and route["remote_model"] == "ci-model"
              for route in payload["data"]
          )
          PY

      - name: Cleanup Docker smoke
        if: always()
        run: |
          docker rm -f freellm-gateway-ci 2>/dev/null || true
          docker volume rm freellm-gateway-ci-data 2>/dev/null || true

  release-gate:
    name: RELEASE GATE
    if: always()
    needs:
      - python-matrix
      - browser-e2e
      - windows-runtime
      - desktop-windows
      - docker-single-instance
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          PYTHON_RESULT: ${{ needs.python-matrix.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          WINDOWS_RESULT: ${{ needs.windows-runtime.result }}
          DESKTOP_RESULT: ${{ needs.desktop-windows.result }}
          DOCKER_RESULT: ${{ needs.docker-single-instance.result }}
        run: |
          printf 'python=%s\nbrowser=%s\nwindows=%s\ndesktop=%s\ndocker=%s\n' \
            "$PYTHON_RESULT" "$BROWSER_RESULT" "$WINDOWS_RESULT" "$DESKTOP_RESULT" "$DOCKER_RESULT"
          test "$PYTHON_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$DESKTOP_RESULT" = success
          test "$DOCKER_RESULT" = success
