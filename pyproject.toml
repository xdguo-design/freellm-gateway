[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freellm-gateway"
version = "0.1.0"
description = "Local prioritized model gateway for FreeLLM"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
  "keyring>=25,<26",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
freellm-gateway = "freellm_gateway.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["freellm_gateway*"]

[tool.setuptools.package-data]
freellm_gateway = ["templates/*.html"]
